# HILDA Alembic config.
#
# Migrations live under core/src/storage/migrations/. The env.py in that
# directory reads the DB URL from HILDA_STORAGE_DB_URL env var (with fall-
# backs), so `sqlalchemy.url` here is intentionally left as a placeholder
# — the runtime URL always comes from the environment or `-x url=...`.
#
# Typical invocation inside the hilda-worker / hilda-api container:
#   alembic -c /app/alembic.ini current
#   alembic -c /app/alembic.ini upgrade head
#   alembic -c /app/alembic.ini downgrade -1
#
# Or offline (no DB connection; emits SQL to stdout for manual review):
#   alembic -c /app/alembic.ini upgrade head --sql

[alembic]
# Path to the migration scripts. Relative to this file's directory.
script_location = core/src/storage/migrations

# Placeholder — real URL comes from HILDA_STORAGE_DB_URL env var (see env.py).
# Kept here so `alembic --help` doesn't warn about a missing url; not consumed.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Version-file naming: default (rev_id + slug). No custom scheme.
# file_template = %%(rev)s_%%(slug)s

# Don't truncate rev messages in `alembic history` output.
truncate_slug_length = 40

# Don't emit empty migrations when nothing changed.
# revision_environment = false


# ---------------------------------------------------------------------------
# Standard logging config (Alembic requires these sections to be present or
# it errors out with "No handlers could be found for logger 'alembic'").
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
