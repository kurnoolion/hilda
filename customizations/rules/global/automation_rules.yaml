# =====================================================================================
# customizations/rules/global/automation_rules.yaml
# =====================================================================================
# Global (Ph-1: only-tier) AutomationRules covering the Ph-1 lifecycle for HILDA's
# core/src/rule_engine module. Co-resident with defaults.yaml; rule_engine loads
# every *.yaml under customizations/rules/global/ at startup per D7 cascade
# 2026-06-23. Per-customer + per-device YAML tiers deferred to Ph-2.
#
# Conforms to:
#   - rule_engine.Rule discriminated model (trigger-action vs polling-schedule)
#   - rule_engine.TriggerKind enum (13-member Ph-1 set per FR-28)
#   - rule_engine.ActionKind enum (18-member Ph-1 set per FR-29)
#   - intra-rule action order = YAML declaration order (only ordering guarantee)
#
# NOTE on pause: FR-31 sub-1 per-item pause is read DIRECTLY by the evaluator from
# `item.rules_paused` on the Deliverables row per D5 cascade 2026-06-23. NOT a rule
# condition -- the evaluator short-circuits paused items. No rule needed here.
#
# NOTE on FR-31 sub-3 manual triggers: these BYPASS rule_engine entirely -- the SP
# UI's Trigger Action dropdown enqueues a Celery task directly via workflow_engine.
# NOT modeled here.
#
# Privacy convention: no real carrier names; only `mock_customer` / MODEL-A / MODEL-B
# references where any customer-specific value appears (almost never -- Global tier
# rules are customer-agnostic by definition).
#
# Anchors: FR-9 (outreach), FR-10 (reminder cadence), FR-23 (email IMAP polling),
# FR-26 (PLM polling), FR-28 (state machine triggers), FR-31 (manual + pause),
# FR-50 (cross-channel escalation), FR-64 (Close All Items per [D-100]),
# FR-87 (TPM resolution A->B->C), Q-M4 (escalation lock 2026-06-25),
# [D-094] (item_type mixed-case lock).
# =====================================================================================

rules:

  # =====================================================================================
  # 1. OUTREACH -- FR-9 initial outreach when collection starts.
  # =====================================================================================

  - rule_id: send_initial_outreach_on_collection_start
    trigger: ItemCreated                                  # fires when setup_milestone / Start Collection creates a tracker per FR-8
    condition:
      field: force_tracking_enabled
      op: eq
      value: true
    # Confirmation items DO get outreach per FR-58 + FR-25(b) lock:
    # "Open -> OutreachSent. FR-8 initial outreach email DOES fire ...
    #  body tailored to JIRA modality: 'please review open JIRA tickets ...
    #  and reply to confirm milestone completion'." The whole point of a
    # Confirmation item is the owner's reply confirming closure; skipping
    # outreach would leave the item indefinitely in Open with no closure
    # signal. Item-type-specific TEMPLATE selection (FR-9 honors
    # tg_email_group_alias batching; modality-tailored body for
    # CustomerJIRA-only Confirmations per FR-25(b)) is a downstream
    # composer concern, not a rule-matching concern -- the rule fires
    # for every item_type that opts in via force_tracking_enabled.
    # Comment "Confirmations skip outreach per FR-58" REMOVED 2026-06-27
    # per architect Step 4 challenge -- prior rule contradicted FR-58.
    actions:
      - kind: SendInitialOutreach                         # per FR-9: honors tg_email_group_alias batching
        params:
          template: initial_outreach_per_owner
          channel: email
      - kind: UpdateState
        params: { target_state: OutreachSent }

  # =====================================================================================
  # 2. REMINDERS -- FR-10 cadence; reminder_count increments by SendReminder action.
  # Tiered cadence: 1st reminder under count<2; 2nd under <3; escalation handled below.
  # =====================================================================================

  # Reminder cadence tracks via reminder_count field only -- NO intermediate state
  # per architect lock 2026-06-26. OwnerResponseReceived removed (redundant with
  # LastContactThreshold trigger; trigger inherently means no recent contact).
  # OutreachReminded removed (cadence is reminder_count, not state).
  - rule_id: send_first_reminder_on_no_contact
    trigger: LastContactThreshold
    condition:
      and:
        - { field: reminder_count, op: lt, value: 1 }
        - { field: delivery_state, op: eq, value: "OutreachSent" }
    actions:
      - kind: SendReminder
        params: { template: standard_owner_reminder_1, channel: email, reminder_count: 1 }

  - rule_id: send_second_reminder_on_no_contact
    trigger: LastContactThreshold
    condition:
      and:
        - { field: reminder_count, op: gte, value: 1 }
        - { field: reminder_count, op: lt, value: 2 }
        - { field: delivery_state, op: eq, value: "OutreachSent" }
    actions:
      - kind: SendReminder
        params: { template: standard_owner_reminder_2, channel: email, reminder_count: 2 }

  # =====================================================================================
  # 3. ESCALATION -- Q-M4 architect lock 2026-06-25.
  # After 2 reminders AND deadline approaching, escalate to corp_messenger.
  # =====================================================================================

  - rule_id: escalate_to_messenger_after_2_reminders
    trigger: LastContactThreshold                         # re-evaluated at each cadence tick
    condition:
      and:
        - { field: reminder_count, op: gte, value: 2 }
        - { field: days_to_deadline, op: lte, value: 3 }
        - { field: delivery_state, op: eq, value: "OutreachSent" }
    actions:
      - kind: Escalate
        params:
          channel: corp_messenger
          reason: reminder_cadence_exhausted
          escalation_template: tg_lead_escalation
      - kind: NotifyPM
        params: { urgency: high, reason: cross_channel_escalation }

  - rule_id: escalate_pm_on_deadline_breach
    trigger: DeadlineProximity                            # FR-11 deadline-near re-arm
    condition:
      and:
        - { field: days_to_deadline, op: lte, value: 0 }
        - { field: delivery_state, op: neq, value: OwnerClosed }
        - { field: delivery_state, op: neq, value: Closed }
    actions:
      - kind: NotifyPM
        params: { urgency: critical, reason: deadline_breach }

  # =====================================================================================
  # 4. STATE MACHINE -- FR-28 + FR-7 transition rules.
  # =====================================================================================

  # NOTE: `advance_state_on_doc_count_reached` is defined in defaults.yaml (seeded from
  # rule_engine MODULE.md Worked Example 3). Not redefined here -- single rule_id per
  # scope per RUL-E001.

  - rule_id: advance_to_document_received_with_parser
    trigger: AttachmentReceived
    condition:
      and:
        - { field: doc_count_reached, op: eq, value: true }
        - { field: item_type, op: eq, value: "test_tech_waiver_report" }   # mixed-case per [D-094]
    actions:
      - kind: TriggerParser                               # FR-16 rule-based parser; runs AFTER defaults.yaml UpdateState chain
        params: {}

  - rule_id: reconcile_owner_intent_on_state_change
    # Architect 2026-06-29 race-resolution: owner may have replied "Closed"
    # via the table while doc_count_not_reached blocked the OwnerClosed
    # transition (guard_denied). apply_owner_reply persisted that intent as
    # owner_intent_closed_at. When the final required doc arrives, defaults.yaml's
    # advance_state_on_doc_count_reached rule advances state to DocumentReceived
    # via AttachmentReceived trigger. The StateChange event fired AFTER that
    # transition is the signal here -- chain another transition to OwnerClosed
    # when the prior owner intent was persisted. Owner shouldn't have to
    # re-confirm. tracker.transitions clears owner_intent_closed_at on
    # OwnerClosed entry so this rule fires at most once per cycle. Using
    # trigger=StateChange (not AttachmentReceived) avoids the RUL-W001
    # collision with advance_state_on_doc_count_reached.
    trigger: StateChange
    condition:
      and:
        - { field: target_state,           op: eq,  value: DocumentReceived }
        - { field: owner_intent_closed_at, op: neq, value: null }
    actions:
      - kind: UpdateState
        params: { target_state: OwnerClosed }

  # trigger_ai_review_on_review_required commented 2026-06-29 per architect
  # Ph-2 defer: rule was a pure TriggerAIReview wrapper; with AI review
  # deferred to Ph-2 (no TaskBinding registered for TRIGGER_AI_REVIEW)
  # the WFL-E001 dispatch failure would block any rule referencing it.
  # Restore when CLASSIFY_DOC_TYPE LLM action lands and the binding is wired.
  # - rule_id: trigger_ai_review_on_review_required
  #   trigger: StateChange
  #   condition:
  #     and:
  #       - { field: target_state, op: eq, value: DocumentReceived }
  #       - { field: review_required, op: eq, value: true }
  #       - { field: item_type, op: eq, value: "test_tech_waiver_report" }   # mixed-case per [D-094]
  #   actions:
  #     - kind: TriggerAIReview
  #       params: {}

  # AI review pass tracks via review_status field on the item -- NO intermediate state
  # per architect lock 2026-06-26. advance_to_ai_reviewed_on_pass rule DELETED;
  # downstream rules check review_status == passed instead of delivery_state == AIReviewed.
  # notify_pm_on_ai_review_fail RETAINED -- this is an action notification, not a state
  # transition (uses NotifyPM action; doesn't touch delivery_state).
  - rule_id: notify_pm_on_ai_review_fail
    trigger: AIReviewResult
    condition:
      field: review_result
      op: eq
      value: failed
    actions:
      - kind: NotifyPM
        params: { urgency: medium, reason: ai_review_failed }

  - rule_id: advance_to_owner_closed_on_status_confirmed
    trigger: OwnerStatusConfirmed
    condition:
      and:
        - { field: doc_count_reached, op: eq, value: true }                 # FR-7 OwnerClosed 2-condition guard
        - { field: delivery_state, op: eq, value: "DocumentReceived" }
    actions:
      - kind: UpdateState
        params: { target_state: OwnerClosed }

  - rule_id: advance_to_ready_for_submission_on_pm_approval
    # Pattern A (SP-authoritative) per architect 2026-06-28 design lock + [D-068]:
    # SP UI engineer's PM Approval button atomically writes 3 fields
    # (delivery_state + pm_approval_at + pm_approval_pm_id) in one SP
    # transaction. Dispatcher refines sub_trigger 'changed' -> 'PmApproved'
    # when pm_approval_at OR pm_approval_pm_id appear in field_deltas.
    # ApplyPMApproval mirrors the 3 fields to local Postgres (no
    # state-machine transition; HILDA trusts SP/TPM authority -- guards
    # enforced on SP-side button visibility + TPM judgment).
    trigger: ItemModified
    sub_trigger: PmApproved
    condition:
      # Snapshot value (pre-CHANGE) per dispatcher._enrich_event canonical-
      # field promotion. After mirror runs, local Postgres reflects
      # ReadyForSubmission; before mirror, snapshot reads UnderPMReview.
      field: delivery_state
      op: eq
      value: UnderPMReview                                # D-138 spelling (no space)
    actions:
      - kind: ApplyPMApproval                             # mirror SP fields to Postgres
        params: {}
      - kind: QueueSubmission                             # FR-18 carrier submission
        params: { channel: customer_adapter }

  # NOTE: `handle_owner_reassignment` is defined in defaults.yaml (seeded from
  # rule_engine MODULE.md Worked Example 1). Not redefined here per RUL-E001.

  - rule_id: rearm_deadline_on_milestone_target_moved
    trigger: ItemModified
    sub_trigger: DeadlineMoved                            # fires on Milestone.target_date edit per [D-085] cascade
    condition: null
    actions:
      - kind: RearmDeadlineProximity                      # internal re-arm; workflow_engine reschedules FR-11
        params: {}

  - rule_id: propagate_tags_on_modification
    trigger: ItemModified
    sub_trigger: TagsModified                             # FR-82 nested tag-set lock
    condition: null
    actions:
      - kind: PropagateTagsToActiveTrackers
        params: {}

  # =====================================================================================
  # 5. TRACKER CREATION -- RETIRED 2026-06-28 per [D-118] / [D-135] strict-boundary
  # cascade. The prior rule instantiate_default_work_item_on_tracker_created fired
  # InstantiateDefaultWorkItem on local TrackerCreated; with the strict boundary
  # SP UI engineer creates ALL SP rows (including the Default WI) and HILDA
  # imports each via import_deliverable_tracker_on_sp_add (Section 9 below).
  # No HILDA-driven Default WI auto-instantiation in Ph-1.
  # =====================================================================================

  # =====================================================================================
  # 6. CLOSE ALL ITEMS -- FR-64 Option (b) per [D-100] HILDA-owned per-item cascade.
  # The milestone-level "Close All Items" button writes closed_all_items_triggered_at;
  # workflow_engine task body iterates per-item AND fires MilestoneAllClosed downstream
  # once every gating item is in {SubmittedToCustomer, Closed}. This rule fires the
  # cleanup chain.
  # =====================================================================================

  - rule_id: milestone_storage_cleanup_on_all_closed
    trigger: MilestoneAllClosed
    condition: null
    actions:
      - kind: MilestoneStorageCleanup                     # FR-76 NSD1 subtree delete
        params: { scope: nsd1_internal }

  - rule_id: halt_polling_at_collection_phase_closure
    trigger: CollectionPhaseClosureReached                # FR-74 collection-phase end
    condition: null
    actions:
      - kind: FinalSweep                                  # one final FR-23 + FR-26 + FR-55 poll across all channels
        params: {}
      - kind: HaltMilestonePolling                        # then stop scheduled polling per FR-74
        params: {}

  # =====================================================================================
  # 7. FR-87 TPM RESOLUTION rules INTENTIONALLY OMITTED per [D-122] 2026-06-25.
  # FR-87 step A (Reassign), B (Resolve doc_type), C (Resolve revision -- Ph-2 scope) is
  # HILDA-rendered-page direct POST -- NOT SP-alert mediated, NOT rule_engine triggered.
  # POST handlers live in core/src/dashboard/app.py per architect Q3 clarification
  # 2026-06-25; flow is: TPM clicks button on HILDA-rendered FR-57 page per [D-074]
  # link-out -> POST to hilda-api -> dashboard handler updates storage + writes audit
  # fields back to SP via SpCrud digest dance per [D-064] + [D-117]. No rule_engine
  # trigger involved at any step. See [D-122] Consequences for full correction history.
  # =====================================================================================

  # =====================================================================================
  # 8. CREDENTIAL HEALTH -- FR-20 background credential expiry.
  # =====================================================================================

  - rule_id: notify_ops_on_credential_expired
    trigger: CredentialExpired
    condition: null
    actions:
      - kind: NotifyHildaOps                              # FR-75 -- routes to HildaOpsAlert (NOT NotifyPM)
        params: { urgency: high, reason: credential_expired }

  # =====================================================================================
  # 9. SP-ALERT-DRIVEN TRACKER IMPORT + KICKOFF -- [D-118] / [D-135] strict-boundary cascade.
  # SP UI engineer creates SP rows (Milestones + Deliverables + Default WI);
  # HILDA reacts to ADDED alerts (import each Deliverable into local storage) +
  # CHANGED alerts with milestone_collection_started_at delta (fire kickoff).
  # =====================================================================================

  - rule_id: import_deliverable_tracker_on_sp_add
    trigger: ItemModified
    sub_trigger: added
    condition:
      field: list_name
      op: eq
      value: Deliverables                                 # scope to Deliverables list (not Milestones/Projects)
    actions:
      - kind: ImportDeliverableTracker                    # task reads body_kvs + routing_key from event.derived_fields
        params: {}

  - rule_id: kickoff_collection_on_milestone_started
    trigger: ItemModified
    sub_trigger: changed
    condition:
      and:
        - { field: list_name,                       op: eq,  value: Milestones }
        - { field: milestone_collection_started_at, op: neq, value: null }
    actions:
      - kind: KickoffCollection                           # groups items by owner; sends batch outreach; transitions NS->Open->OutreachSent
        params: {}

  # Submit-to-Carrier trigger per architect design pass 2026-06-30.
  # TPM clicks the SP UI button after all items are in ReadyForSubmission
  # (SP UI engineer guards visibility). Button sets milestone_submission_triggered_at
  # on the Milestone row; SP sends CHANGED alert; sp_alert_parser promotes the
  # field into field_deltas (parser.py _MILESTONE_PROMOTE_FIELDS tuple). This
  # rule fires the SubmitToCarrier action which iterates in-milestone items in
  # RFS state, uploads all classified documents per item via customer_adapter,
  # and transitions each item to SubmittedToCarrier on all-files-success.
  # Pattern A (SP-authoritative) per [D-068] -- HILDA trusts the SP-side guard.
  - rule_id: submit_to_carrier_on_milestone_submission_triggered
    trigger: ItemModified
    sub_trigger: changed
    condition:
      and:
        - { field: list_name,                         op: eq,  value: Milestones }
        - { field: milestone_submission_triggered_at, op: neq, value: null }
    actions:
      - kind: SubmitToCarrier
        params: {}

# =====================================================================================
# POLLING SCHEDULES -- FR-23 (email IMAP) + FR-26 (corp PLM) deadline-tiered.
# Consumed on-demand by workflow_engine via resolve_polling_schedule_for_item();
# NOT event-fired. Per polling_schedule.evaluate_polling_schedule: tiers in
# ascending days_before_deadline; baseline (null) required per RUL-W004 fallback.
# =====================================================================================

polling_schedules:

  # FR-23 -- email IMAP fallback polling deadline-tiered
  - rule_id: email_imap_polling_schedule
    tiers:
      - { days_before_deadline: null, interval_minutes: 60 }   # baseline -- 60min hourly
      - { days_before_deadline: 7,    interval_minutes: 30 }   # 7d out -- 30min
      - { days_before_deadline: 3,    interval_minutes: 15 }   # 3d out -- 15min
      - { days_before_deadline: 1,    interval_minutes: 5  }   # 1d out -- 5min tight cadence

  # FR-26 -- corp PLM polling deadline-tiered (faster baseline than email per
  # PLM-as-canonical-source design)
  - rule_id: plm_polling_schedule
    tiers:
      - { days_before_deadline: null, interval_minutes: 30 }   # baseline -- 30min
      - { days_before_deadline: 7,    interval_minutes: 15 }
      - { days_before_deadline: 3,    interval_minutes: 10 }
      - { days_before_deadline: 1,    interval_minutes: 3  }

  # NOTE: `default_polling_schedule` is defined in defaults.yaml (seeded from
  # rule_engine MODULE.md Worked Example 3). Not redefined here per RUL-E001.
