# Single email destination -- the HILDA OPS BOT alias.
# Receives ONE email per ops_alerts.emit_alert(...) call.
ops_bot_email: hilda-ops-bot@mock-corp.com

# N messenger DM destinations -- each corp_id receives ONE message per alert.
# Order doesn't matter; failures on individual corp_ids are best-effort
# (OPS-E003 partial / OPS-E004 total fan-out failure logged via diagnostics).
broadcast_corp_ids:
  - mock_ops_a
  - mock_ops_b

# Rate limit per-(source, error_code) per rolling 60-second window.
#   null = no rate limit (Ph-1 default; every call fans out)
#   N    = at most N alerts per (source, error_code) tuple per 60s window
# Excess alerts: OpsAlertResult.suppressed_by_rate_limit=True, no fan-out.
rate_limit_per_minute: null
