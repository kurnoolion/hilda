# =====================================================================================
# customizations/template_schemas/mock_customer/template.yaml
# =====================================================================================
# Privacy-clean per-customer canonical template for HILDA Ph-1 end-to-end testing.
# Conforms to template_schema.CustomerTemplateBase Pydantic model.
#
# Field-name authority: docs/sp_ui_engineer/milestones_workitems_fields_values.xlsx
# (Milestones / Deliverables / Projects worksheets) per architect Q5 lock 2026-06-25.
#
# Privacy convention: customer_id=mock_customer; device models MODEL-A / MODEL-B;
# project_id=1001; vendor=Carrier; mock owners (John Smith / Jane Doe). NEVER carry
# real carrier names (VZW / TMO / Samsung / Galaxy / etc.) in committed YAML.
#
# Per-item value notes:
#   - item_type per [D-094] SUPERSEDED 2026-06-23 SP UI engineer mixed-case lock:
#       Confirmation (PascalCase)
#       test_tech_waiver_report (snake_case)
#       compliance_certification_release_notes (snake_case)
#       Default (PascalCase) -- the FR-78 default work-item is AUTO-CREATED by
#       setup_milestone; NOT enumerated here.
#   - 4-field owner identity per [D-080] + [D-086]: owners block below seeds template-time
#     placeholders; TPM types final values in SP UI between setup_milestone and Start
#     Collection per Ph-1 setup-window lock 2026-06-20.
#   - TG fields denormalized per [D-051] onto each work_item row at HILDA runtime;
#     YAML still groups them here for ops readability + template-author convenience.
#   - item_description per FR-82 nested tag-set lock: list-of-lists, length must equal
#     doc_count (TSC-W008); null/empty allowed only for Confirmation + Default items.
#   - Form-factor flags per [D-084]: handset/tablet/wearable/ir/osmr/rmr/hmr_smr.
#
# Path composition for FR-77 carrier-portal upload:
#   <customer_delivery_info>/<delivery_path_template expanded>/<per-item target_folder>
#   = drive.google.com/Carrier/Submissions/{device_id}/{milestone_name}/<target_folder>
# Composition is done internally by customer_adapter per [D-116] B-alpha lock.
# =====================================================================================

# ============================================================
# Customer-level
# ============================================================
customer_id: mock_customer
customer_jira_url: https://jira.example.com/projects/MOCK   # Ph-2 informational only per [D-092]

# Customer-level carrier-portal delivery config (per architect lock 2026-06-21):
customer_delivery_info: drive.google.com                    # base URL; denormalized per-item at setup_milestone
delivery_path_template: "Carrier/Submissions/{project_model}/{milestone_name}"

# ============================================================
# Devices (per [D-091] YAML key = device_id; work-items live under milestones per FR-40)
# ============================================================
devices:
  MODEL-A:
    device_name: Mock Device A
    project_id: 1001                                        # Projects_<customer_id> row PK per [D-104]
    project_model: MODEL-A                                  # equals device_id; denormalized for composite-key lookups
    assigned_pm_id: pm_a@mock.example.com                   # template-time PM; runtime resolves via Projects list per [D-088]
    target_launch_date: 2026-09-01

  MODEL-B:
    device_name: Mock Device B
    project_id: 1002
    project_model: MODEL-B
    assigned_pm_id: pm_b@mock.example.com
    target_launch_date: 2026-10-15

# ============================================================
# Milestones (per-customer; same set instantiated for every device at setup_milestone)
# `target_date` is the SOLE authoritative deadline per [D-085]; TPM types if absent.
# `collection_start_offset_days` = days BEFORE target_date for FR-8 StartCollection auto-fire.
# ============================================================
milestones:
  P1:
    target_date: 2026-07-15
    collection_start_offset_days: 30                        # auto-StartCollection 30 days before target
    devices: [MODEL-A, MODEL-B]                             # multi-device milestone scope
    # status hardcoded "Not Started" by setup_milestone per FR-6

    # ----------------------------------------
    # Work items per [D-051] denormalization (TG fields flat per row).
    # Default work-item is AUTO-CREATED by setup_milestone per FR-78 (NOT listed here).
    # 10 work items P1 -- exercises FR-52 routing pipeline (substring + fuzzy + over-route).
    # ----------------------------------------
    work_items:

      # ---- 1. Confirmation item (FR-58: doc_count=0, no_customer_upload=true) ----
      - item_no: 1
        item_name: Device Readiness Review
        item_type: Confirmation                             # PascalCase per [D-094] SUPERSEDED 2026-06-23
        milestone_gating: true
        tracking_modality: [Email]
        doc_count: 0                                        # Confirmation invariant per TSC-W004
        review_required: false
        no_customer_upload: true                            # confirmation never ships to carrier
        force_tracking_enabled: true
        item_description: null                              # null allowed for Confirmation per FR-82
        item_path_id: null
        tg_path_id: null
        customer_delivery_modality: None
        target_folder: null                                 # confirmation -- no upload
        # Form-factor (handset/tablet/wearable/ir/osmr/rmr/hmr_smr) per [D-084]:
        handset: true
        tablet: true
        wearable: false
        ir: false
        osmr: false
        rmr: false
        hmr_smr: false
        # TG denormalization per [D-051]:
        tg_name: GENERAL
        ingress_nsd: None                                   # Ph-1 lock -- no NSD ingress for early drop
        folder_routing_enabled: false
        tg_email_group_alias: null                          # TPM fills before Start Collection
        tg_owner_name: null
        tg_owner_corp_usa_email: null
