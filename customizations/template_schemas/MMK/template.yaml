# customizations/template_schemas/MMK/template.yaml
# Authored by PM team lead per phases/development.md (Ph-1 manual; Ph-2+ generated by
# template_schema_ingestor per [D-010] + [D-018]).
# Conforms to template_schema.CustomerTemplateBase Pydantic model.
#
# Path composition for carrier-portal upload (FR-77 dispatch):
#   {customer_delivery_info}/{delivery_path_template expanded}/{per-item target_folder}
#   = drive.google.com/OEM_Folder1/OEM_Folder2/MODEL-A/P1/{item target_folder}

# ============================================================
# Customer-level
# ============================================================
customer_id: MMK                                  # carrier code; HILDA-canonical
customer_jira_url: https://mmk.atlassian.net      # HILDA-config-only (NOT in SP per [D-083])

# Customer-level carrier-portal config (per architect lock 2026-06-21):
customer_delivery_info: drive.google.com          # base URL (denormalized per-item at setup_milestone)
delivery_path_template: "OEM_Folder1/OEM_Folder2/{project_model}/{milestone_name}"
                                                  # carrier intermediate folders + per-(device, milestone)
                                                  # expansion; produces milestone HOME directory

# ============================================================
# Devices (no work-items here; same work-items apply across devices per FR-40)
# ============================================================
devices:
  MODEL-A:                                        # device_id (YAML key per [D-091])
    device_name: Mock Device A
    target_launch_date: 2026-12-01

# ============================================================
# Milestones (per-customer; same set instantiated for every device at setup_milestone)
# ============================================================
milestones:
  P1:                                             # milestone_name (YAML key per [D-091])
    # target_date: null  -> TPM types before Start Collection per FR-88
    # status: hardcoded "Not Started" by setup_milestone per FR-6

    # ----------------------------------------
    # Work items (TG fields denormalized per-work-item per [D-051])
    # Default work-item is AUTO-CREATED by setup_milestone per FR-78 — NOT listed here
    # ----------------------------------------
    work_items:

      - item_no: 1
        item_name: Device Readiness Review
        item_type: Confirmation
        tracking_modality: [Email]
        doc_count: 0
        review_required: false
        no_customer_upload: true                  # confirmation invariant per TSC-W004
        force_tracking_enabled: true
        milestone_gating: true
        item_description: null
        item_path_id: null                        # confirmation — no NSD path
        tg_path_id: null
        customer_delivery_modality: None
        target_folder: null                       # confirmation — no upload
        # Form-factor flags (handset/tablet/wearable/ir/osmr/rmr/hmr_smr):
        handset: true
        tablet: true
        wearable: true
        ir: true
        osmr: true
        rmr: true
        hmr_smr: true
        # TG-denormalized fields (per [D-051]):
        tg_name: MNO-TPM
        ingress_nsd: None                         # Ph-1 lock — no NSD ingress for early drop
        folder_routing_enabled: false
        tg_email_group_alias: null                # null in template; TPM types before Start Collection
        tg_owner_name: null
        tg_owner_corp_usa_email: null
        tg_owner_corp_email: null
        tg_owner_corp_id: null
        corp_id_list: null
        email_cc_list: null

      - item_no: 2
        item_name: Sustainability Certification Form
        item_type: compliance_certification_release_notes
        tracking_modality: [Email]
        doc_count: 1
        review_required: false
        no_customer_upload: false
        force_tracking_enabled: true
        milestone_gating: true
        item_description: [["Sustainability"]]
        item_path_id: mno_cpm_item
        tg_path_id: mno_cpm
        customer_delivery_modality: GoogleDrive
        target_folder: "Compliance/Sustainability"
        handset: true
        tablet: true
        wearable: false
        ir: true
        osmr: true
        rmr: true
        hmr_smr: true
        tg_name: CPM
        ingress_nsd: None
        folder_routing_enabled: false
        tg_email_group_alias: null
        tg_owner_name: null
        tg_owner_corp_usa_email: null
        tg_owner_corp_email: null
        tg_owner_corp_id: null
        corp_id_list: null
        email_cc_list: null

