# =====================================================================================
# HILDA SharePoint configuration — example / reference YAML
# =====================================================================================
#
# Status: 3-list per-customer scope per Module #11 architect Q1 lock 2026-06-25
# (commit 9810e33) + [D-104] Projects per-customer. Pre-cascade 7-list version is
# preserved in git history (commits prior to b655fea); see core/src/
# sharepoint_integration/MODULE.md rollback log for the 2026-06-25 contraction.
#
# Field-name authority: docs/sp_ui_engineer/milestones_workitems_fields_values.xlsx
# (3 worksheets: Milestones / Deliverables / Projects) per architect Q5 lock
# 2026-06-25. Stale HILDA_SP_Schema.xlsx + DeliveryItem_visibility_review.xlsx
# renamed _DEPRECATED_2026-06-15.xlsx in the same directory.
#
# How this file is used:
#   - SP UI engineer reads this file (+ the authoritative xlsx) at customer-
#     deployment time and HAND-CREATES the SP lists + columns in SP UI directly,
#     including SP-alert subscriptions and any custom SP-side workflows. HILDA
#     does NOT call REST to create lists per D-DRAFT-X (pending ratification):
#     corp SP-2017's SP-alert + custom-task requirement makes UI-side provisioning
#     structurally necessary. "Owner of SP module is SP UI engineer; HILDA uses
#     SP services."
#   - Once SP UI engineer creates the lists, HILDA's FileBasedListProvider per
#     [D-020] reads this YAML at startup to translate canonical field names <->
#     SP internal column names for REST writeback per [D-064].
#
# Three-tier name model per [D-065]:
#   HILDA canonical name  ->  SP internal column name  ->  SP display name
#   (Python code field)      (REST wire protocol)         (TPM-visible browser label)
#   |--- this file ---|      |---- this file -----|       |-- SP UI engineer owns --|
#                                                            (NOT in this YAML)
#
# SP Choice column allowed values are ALSO owned by SP UI engineer per [D-065];
# this YAML records column names only, never the Choice value enumeration.
#
# 3-list framing per Module #11 lock 2026-06-25 (was 7 per pre-cascade D-DRAFT-Y;
# was 8 per [D-051] original). HILDA's SP scope contracted to per-customer:
#   delivery_items → Deliverables_<customer_id>
#   milestones     → Milestones_<customer_id>
#   projects       → Projects_<customer_id>
# HILDA does NOT touch SP-side TasksTemplate / Tasks / Trials / Activities /
# Email / CommunicationLog lists (SP UI engineer's display surface only).
#
# slug → id rename per [D-091]: customer_slug → customer_id; device_slug →
# device_id throughout.
#
# Privacy convention: <customer_id> placeholder; never real carrier names.
#
# =====================================================================================

customer_id: example                      # MUST match this filename + template_schema customer_id

lists:                                    # 3 lists per Module #11 lock 2026-06-25

  # ---------------------------------------------------------------------------------
  # Deliverables_<customer_id> — primary tracking table per architect Q1
  #   one row per per-milestone work-item; ~40+ fields grouped by tg_name in the
  #   SP milestone view (FR-56)
  # ---------------------------------------------------------------------------------
  delivery_items:
    name: "Deliverables_example"                                              # SP list display name per architect Q1 + [D-104]

    columns:
      # ---- Item-identity fields ----
      item_no: "Item_x0020_No"                                                # IMMUTABLE per item lifetime
      item_name: "Title"
      item_description: "Item_x0020_Description"                              # JSON list-of-lists per FR-82

      # ---- Item type + state ----
      item_type: "Item_x0020_Type"                                            # Choice; values per [D-053] / [D-094] SUPERSEDED 2026-06-23 SP UI engineer mixed-case lock
      delivery_state: "Delivery_x0020_State"                                  # Choice; state machine values
      rules_paused: "Rules_x0020_Paused"                                      # Boolean per [D-108] FR-31 sub-1 per-item pause

      # ---- 4-field owner identity per [D-105] ----
      owner_corp_usa_email: "Owner_x0020_Corp_x0020_USA_x0020_Email"          # preferred for outreach when set
      owner_corp_email: "Owner_x0020_Corp_x0020_Email"                        # outreach fallback + corp identity match
      owner_corp_id: "Owner_x0020_Corp_x0020_Id"                              # PLM grouping key per FR-5 + FR-8 step 2 + [D-035]
      owner_name: "Owner_x0020_Name"                                          # display + email salutation
      owner_status_note: "Owner_x0020_Status_x0020_Note"                      # TPM-curated note

      # ---- Pipeline routing ----
      target_folder: "Target_x0020_Folder"                                    # FR-77 outbound carrier-folder per-item content
      no_customer_upload: "No_x0020_Customer_x0020_Upload"                    # FR-80 boolean skip gate

      # ---- TG denormalization per [D-106] (TGGroupBase Pydantic model DROPPED) ----
      tg_name: "TG_x0020_Name"                                                # was TGGroupBase.tg_name; now flat per-DI column

      # ---- Time tracking ----
      actual_completion_date: "Actual_x0020_Completion_x0020_Date"            # DateTime

      # ---- Communication routing ----
      email_cc_list: "Email_x0020_CC_x0020_List"                              # semi-colon separator per [D-102]
      plm_id: "PLM_x0020_Id"                                                  # corp PLM ticket reference

      # ---- Form-factor flags per [D-084] ----
      handset: "Handset"                                                      # Boolean
      tablet: "Tablet"
      wearable: "Wearable"
      ir: "IR"
      osmr: "OSMR"
      rmr: "RMR"
      hmr_smr: "HMR_x0020_SMR"

      # ---- FR-87 TPM resolution fields ----
      tpm_reassignment_target_item_id: "TPM_x0020_Reassign_x0020_Target"      # FR-87 step (A)
      tpm_resolved_doc_type: "TPM_x0020_Resolved_x0020_DocType"               # FR-87 step (B) Choice per [D-053] 5-value DocType
      tpm_revision_resolution: "TPM_x0020_Revision_x0020_Resolution"          # FR-87 step (C)

      # ---- PM approval audit per [D-068] ----
      pm_approval_at: "PM_x0020_Approval_x0020_At"                            # DateTime; FR-28 PMApproval trigger
      pm_approval_pm_id: "PM_x0020_Approval_x0020_PM_x0020_Id"                # User type; PM/TPM attribution

      # NOTE: `last_updated` is NOT a custom column -- use SP's built-in `Modified`
      # field per SP UI engineer 2026-06-10 (SP system column reuse discipline).

  # ---------------------------------------------------------------------------------
  # Milestones_<customer_id> — per-customer per [D-104]
  #   one row per (customer, device, milestone) triple; HILDA writes audit-only fields
  # ---------------------------------------------------------------------------------
  milestones:
    name: "Milestones_example"

    columns:
      milestone_name: "Title"                                                 # STR per [D-090] (NOT integer milestone_id)
      milestone_status: "Status"                                              # Choice: Not Started / In Progress / Completed / Delayed
      target_date: "Target_x0020_Date"                                        # DateTime

      # HILDA audit-only writes per [D-064] writeback channel
      milestone_collection_started_at: "Milestone_x0020_Collection_x0020_Started_x0020_At"
      milestone_submission_triggered_at: "Milestone_x0020_Submission_x0020_Triggered_x0020_At"
      refresh_requested_at: "Refresh_x0020_Requested_x0020_At"                # FR-56 soft-poll
      close_all_items_triggered_at: "Close_x0020_All_x0020_Items_x0020_Triggered_x0020_At"  # FR-64 Close All Items per [D-100]

      # NOTE: `default_work_item_config` is NOT a SP column — it's customer-
      # deployment-fixed config; lives in customizations/template_schemas/
      # <customer_id>/milestones.yaml per FR-78 / [D-053]. Not TPM-editable.

  # ---------------------------------------------------------------------------------
  # Projects_<customer_id> — per [D-104] (supersedes [D-083]/[D-088] global-Projects framing)
  #   HILDA reads project_id → (project_model, TPM) lookup for outreach attribution
  # ---------------------------------------------------------------------------------
  projects:
    name: "Projects_example"

    columns:
      project_id: "Title"                                                     # PK
      project_model: "Project_x0020_Model"                                    # device model class
      tpm_email: "TPM_x0020_Email"                                            # TPM's email per [D-088] 3-tuple

# =====================================================================================
# REMOVED in Module #11 cascade 2026-06-25 (architect Q1 lock):
# =====================================================================================
#   customers          → moved to customizations/template_schemas/<customer_id>/customer.yaml
#   devices            → moved to customizations/template_schemas/<customer_id>/customer.yaml devices: block
#   users              → SP UI engineer's display surface; HILDA reads PM email from Projects per [D-088]
#   pm_credentials     → credential_service per [D-019] + [D-107]; not a SP list HILDA touches
#   communication_log  → HILDA's CommunicationLog is Postgres-internal per FR-42 (architect Q3 lock)
#   tg_groups          → DROPPED per [D-106]; TG fields denormalized onto delivery_items
#
# SP-side existence of these lists (or other SP UI engineer lists like Tasks /
# TasksTemplate / Trials / Activities / Email / CommunicationLog) does NOT affect
# HILDA — those lists are out of HILDA's SP scope per architect Q1 2026-06-25.
# =====================================================================================
