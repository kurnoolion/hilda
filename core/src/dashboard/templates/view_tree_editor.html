<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>{{ filename }} — HILDA</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #placeholder { width: 100vw; height: 100vh; }
  </style>
  <script type="text/javascript" src="{{ onlyoffice_public_url }}/web-apps/apps/api/documents/api.js"></script>
</head>
<body>
  <div id="placeholder"></div>
  <script>
    // Config built + signed server-side by HILDA per OnlyOffice contract.
    // The `token` MUST sign the ENTIRE config (document + editorConfig +
    // documentType + ...) or OnlyOffice rejects with "security token not
    // correctly formed". HILDA computes the JWT over the same dict that's
    // passed to DocEditor here.
    var config = {{ docs_config_json | safe }};
    config.token = "{{ docs_config_token }}";
    var docEditor = new DocsAPI.DocEditor("placeholder", config);
  </script>
</body>
</html>
